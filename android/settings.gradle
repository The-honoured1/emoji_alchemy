def localPropertiesFile = new File(rootProject.projectDir.parentFile, 'local.properties')
def properties = new Properties()

if (localPropertiesFile.exists()) {
    properties.load(localPropertiesFile.newDataInputStream())
}

def flutterSdkPath = properties.getProperty('flutter.sdk')
if (flutterSdkPath == null || flutterSdkPath.trim().isEmpty()) {
    flutterSdkPath = System.getenv('FLUTTER_ROOT')
}

if (flutterSdkPath == null || flutterSdkPath.trim().isEmpty()) {
    throw new GradleException('Flutter SDK not found. Define flutter.sdk in local.properties or set FLUTTER_ROOT.')
}

apply from: "$flutterSdkPath/packages/flutter_tools/gradle/app_plugin_loader.gradle"
